/* CityView brand: Rich Blue header with the logo, Seasalt page, copper accents. Search first, list below. */
:root{
  --blue:#0D2137; --copper:#9E6C44; --sunset:#F3D0A2; --alabaster:#E4E0D5; --seasalt:#F7F6F9;
  --ink:#1D1D1F; --muted:#6A6E76; --white:#FFFFFF;
  --gold:linear-gradient(90deg,#F3D0A2,#9E6C44);
  --font:Montserrat,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--seasalt);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:var(--blue);padding:18px 20px}
.bar{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar img{height:46px;width:auto;display:block}
.upd{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B9C2CE;text-align:right}
.upd b{display:block;color:var(--sunset);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:13px;margin-top:2px}
.rule{height:3px;background:var(--gold)}
main{max-width:880px;margin:0 auto;padding:0 20px 40px}
.intro{padding:28px 0 18px}
h1{margin:0;font-weight:600;font-size:30px;letter-spacing:-.01em;color:var(--blue);text-wrap:balance}
.intro p{margin:8px 0 0;color:var(--muted);font-size:15px;font-weight:400;line-height:1.5}
.searchwrap{position:sticky;top:0;z-index:10;background:var(--seasalt);padding:12px 0}
.box{position:relative;display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--alabaster);border-radius:14px;padding:0 14px 0 16px;box-shadow:0 6px 24px rgba(13,33,55,.07);transition:border-color .15s}
.box:focus-within{border-color:var(--copper)}
.box svg{flex:none;color:var(--copper)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;font-weight:500;padding:16px 0;color:var(--blue)}
#q::placeholder{color:#9A9EA6;font-weight:400}
#q::-webkit-search-cancel-button{display:none}
.clear{display:none;border:0;background:var(--seasalt);color:var(--blue);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 12px;border-radius:9px}
.clear:focus-visible,.az a:focus-visible,.sug li:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.sug{display:none;position:absolute;left:-1.5px;right:-1.5px;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--white);border:1px solid var(--alabaster);border-radius:14px;box-shadow:0 16px 40px rgba(13,33,55,.14)}
.sug.open{display:block}
.sug li{padding:11px 12px;border-radius:9px;font-size:15px;color:var(--blue);cursor:pointer}
.sug li[aria-selected="true"],.sug li:hover{background:var(--seasalt)}
.sug b{font-weight:700;color:var(--copper)}
.status{display:none;margin:12px 2px 0;font-size:14px;color:var(--muted)}
.status.show{display:block}
.status strong{color:var(--blue);font-weight:600}
.status.none strong{color:#9B3D1D}
.az{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.az a{min-width:34px;height:34px;display:grid;place-items:center;border-radius:9px;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;background:var(--white);border:1px solid var(--alabaster)}
.az a:hover{border-color:var(--copper);color:var(--copper)}
.group{margin-bottom:22px;scroll-margin-top:96px}
.group h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--copper)}
.list{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--alabaster);border-radius:14px;overflow:hidden}
.list li{padding:14px 16px;border-top:1px solid #EFECE5;font-size:15px;font-weight:500;color:var(--blue);overflow-wrap:break-word}
.list li:first-child{border-top:0}
mark{background:transparent;color:var(--copper);font-weight:700}
.empty{background:var(--white);border:1px dashed var(--alabaster);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
body.searching .intro,body.searching .az{display:none}
body.searching .searchwrap{padding-top:14px}
@media (max-width:600px){
  header{padding:14px 16px}.bar img{height:38px}.upd{font-size:10.5px}.upd b{font-size:12px}
  main{padding:0 14px 32px}.intro{padding:22px 0 12px}h1{font-size:24px}.intro p{font-size:14px}
  #q{font-size:16px;padding:14px 0}
  .az{flex-wrap:nowrap;overflow-x:auto;margin:4px -14px 16px;padding:2px 14px 6px;scrollbar-width:none}
  .az::-webkit-scrollbar{display:none}.az a{flex:none}
  .list li{padding:13px 14px;font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

const norm = s => s.toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDX = NAMES.map(n => { const w = norm(n).split(" "); return {n, w, tails: w.map((_,i)=>w.slice(i).join(""))}; });
// Every typed word must start a word in the name; the whole query without spaces may also start at any word (so "bekh" finds "B E K H").
function score(e, qw, qc){
  if (!qw.length) return 0;
  let ok = qw.every(t => e.w.some(w => w.startsWith(t)));
  let compact = qc.length >= 3 && e.tails.some(t => t.startsWith(qc));
  if (!ok && !compact) return 0;
  return (e.tails[0].startsWith(qc) ? 3 : 0) + (e.w[0].startsWith(qw[0]) ? 2 : 0) + 1;
}
function search(raw){
  const qw = norm(raw).split(" ").filter(Boolean), qc = qw.join("");
  return IDX.map(e => [e, score(e, qw, qc)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1] || a[0].n.localeCompare(b[0].n)).map(x => x[0].n);
}
function hl(name, raw){
  const qw = norm(raw).split(" ").filter(Boolean); if (!qw.length) return esc(name);
  return name.split(/(\s+)/).map(part => {
    const p = norm(part), t = qw.find(t => p && p.startsWith(t));
    if (!t) return esc(part);
    let i = 0, seen = 0; while (i < part.length && seen < t.length) { if (/[a-z0-9]/i.test(part[i])) seen++; i++; }
    return "<mark>"+esc(part.slice(0,i))+"</mark>"+esc(part.slice(i));
  }).join("");
}

let active = -1, current = [];
function browse(){
  const groups = {}; NAMES.forEach(n => (groups[letterOf(n)] ||= []).push(n));

  az.innerHTML = L.map(l => '<a href="#L-'+(l==="#"?"0":l)+'">'+l+'</a>').join("");

function renderSug(raw){

q.addEventListener("blur", () => setTimeout(closeSug, 150));
q.addEventListener("keydown", e => {
